
name: Build ANISCROLL-TV Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: aniscroll-tv-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null

          sdkmanager --install \
            "platforms;android-36.1" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Prepare signing keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          KEYSTORE_PATH="$RUNNER_TEMP/aniscroll-upload-key.jks"

          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" \
              | base64 --decode > "$KEYSTORE_PATH"

            echo "Using configured GitHub release keystore."

          elif [ -f "my-upload-key.jks" ]; then
            cp "my-upload-key.jks" "$KEYSTORE_PATH"
            echo "Using repository-local keystore."

          else
            echo "::error::No release keystore found."
            echo "Configure RELEASE_KEYSTORE_BASE64 and signing passwords."
            exit 1
          fi

          chmod 600 "$KEYSTORE_PATH"

          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Keystore is empty."
            exit 1
          fi

          STORE_PASS="${RELEASE_STORE_PASSWORD:-}"
          KEY_PASS="${RELEASE_KEY_PASSWORD:-}"

          if [ -z "$STORE_PASS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Release signing passwords are missing."
            exit 1
          fi

          if ! keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$STORE_PASS" \
            -alias upload >/dev/null 2>&1; then
            echo "::error::Keystore alias 'upload' could not be verified."
            exit 1
          fi

          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "Release keystore verified."

      - name: Configure optional API values
        shell: bash
        env:
          HOSHIKA_CLIENT_ID: ${{ secrets.HOSHIKA_CLIENT_ID }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          FANART_API_KEY: ${{ secrets.FANART_API_KEY }}
        run: |
          set -euo pipefail

          : > .env

          [ -z "$HOSHIKA_CLIENT_ID" ] || \
            printf 'HOSHIKA_CLIENT_ID=%s\n' "$HOSHIKA_CLIENT_ID" >> .env

          [ -z "$TMDB_API_KEY" ] || \
            printf 'TMDB_API_KEY=%s\n' "$TMDB_API_KEY" >> .env

          [ -z "$FANART_API_KEY" ] || \
            printf 'FANART_API_KEY=%s\n' "$FANART_API_KEY" >> .env

          chmod 600 .env

          echo "Optional API configuration prepared."

      - name: Build signed release APK
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          gradle assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Verify release APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::Release APK was not generated."
            find app/build/outputs -type f -name '*.apk' -print || true
            exit 1
          fi

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            verify --verbose "$APK"

          echo "APK size:"
          du -h "$APK"

          echo "APK SHA-256:"
          sha256sum "$APK"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: ANISCROLL-TV-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Export signing keystore backup
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ANISCROLL-TV-signing-keystore-backup
          path: ${{ env.KEYSTORE_PATH }}
          if-no-files-found: error
          retention-days: 7
