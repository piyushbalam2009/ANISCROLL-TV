name: Build ANISCROLL-TV Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: aniscroll-tv-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu runner already includes Android command-line tools.
      # Do not use android-actions/setup-android here: its default setup
      # attempts to install the removed SDK package named "tools".
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "::error::Android SDK was not found on the runner."
            exit 1
          fi

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager was not found."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          # sdkmanager exits after accepting licenses; yes may receive SIGPIPE.
          # Temporarily disable pipefail so that expected SIGPIPE does not fail the step.
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses
          set -o pipefail

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platforms;android-36.1" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Generate temporary release keystore
        shell: bash
        run: |
          set -euo pipefail

          # TEMPORARY ONLY: a new signing identity is created for every workflow run.
          # APKs from separate runs will not be update-compatible.
          KEYSTORE_PATH="$RUNNER_TEMP/aniscroll-upload-key.jks"
          STORE_PASSWORD="$(openssl rand -hex 24)"
          KEY_PASSWORD="$STORE_PASSWORD"

          keytool -genkeypair -v \
            -keystore "$KEYSTORE_PATH" \
            -alias upload \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=ANISCROLL-TV, OU=Release, O=ANISCROLL, L=Unknown, ST=Unknown, C=IN"

          chmod 600 "$KEYSTORE_PATH"
          {
            echo "KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

          echo "A temporary signing keystore was generated for this run only."

      - name: Configure optional API values
        shell: bash
        env:
          HOSHIKA_CLIENT_ID: ${{ secrets.HOSHIKA_CLIENT_ID }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          FANART_API_KEY: ${{ secrets.FANART_API_KEY }}
        run: |
          set -euo pipefail
          : > .env
          [ -z "$HOSHIKA_CLIENT_ID" ] || printf 'HOSHIKA_CLIENT_ID=%s\n' "$HOSHIKA_CLIENT_ID" >> .env
          [ -z "$TMDB_API_KEY" ] || printf 'TMDB_API_KEY=%s\n' "$TMDB_API_KEY" >> .env
          [ -z "$FANART_API_KEY" ] || printf 'FANART_API_KEY=%s\n' "$FANART_API_KEY" >> .env
          chmod 600 .env
          echo "Optional API configuration prepared."

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail
          export STORE_PASSWORD="$RELEASE_STORE_PASSWORD"
          export KEY_PASSWORD="$RELEASE_KEY_PASSWORD"
          gradle assembleRelease --no-daemon --stacktrace

      - name: Verify release APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::Release APK was not generated."
            find app/build/outputs -type f -name '*.apk' -print || true
            exit 1
          fi

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          echo "APK size:"
          du -h "$APK"
          echo "APK SHA-256:"
          sha256sum "$APK"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: ANISCROLL-TV-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
