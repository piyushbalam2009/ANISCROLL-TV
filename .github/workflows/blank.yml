
name: Build ANISCROLL-TV Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: aniscroll-tv-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-36.1" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # Restore the same generated signing key between builds.
      - name: Restore signing keystore
        id: signing-key
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/aniscroll-upload-key.jks
          key: aniscroll-release-keystore-v1

      # Generate a key only on the first run.
      - name: Generate release keystore if missing
        if: steps.signing-key.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/aniscroll-upload-key.jks" \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storetype JKS \
            -dname "CN=AniScroll, OU=Android, O=AniScroll, L=India, ST=Maharashtra, C=IN" \
            -storepass "${{ secrets.RELEASE_STORE_PASSWORD || 'AniScrollTemporaryStore2026' }}" \
            -keypass "${{ secrets.RELEASE_KEY_PASSWORD || 'AniScrollTemporaryKey2026' }}"

          chmod 600 "$RUNNER_TEMP/aniscroll-upload-key.jks"

      - name: Configure signing environment
        shell: bash
        run: |
          echo "KEYSTORE_PATH=$RUNNER_TEMP/aniscroll-upload-key.jks" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD || 'AniScrollTemporaryStore2026' }}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD || 'AniScrollTemporaryKey2026' }}" >> "$GITHUB_ENV"

      - name: Configure optional API values
        shell: bash
        env:
          HOSHIKA_CLIENT_ID: ${{ secrets.HOSHIKA_CLIENT_ID }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          FANART_API_KEY: ${{ secrets.FANART_API_KEY }}
        run: |
          set -euo pipefail
          : > .env

          [ -z "$HOSHIKA_CLIENT_ID" ] || printf 'HOSHIKA_CLIENT_ID=%s\n' "$HOSHIKA_CLIENT_ID" >> .env
          [ -z "$TMDB_API_KEY" ] || printf 'TMDB_API_KEY=%s\n' "$TMDB_API_KEY" >> .env
          [ -z "$FANART_API_KEY" ] || printf 'FANART_API_KEY=%s\n' "$FANART_API_KEY" >> .env

          chmod 600 .env

      - name: Verify signing keystore
        run: |
          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD" \
            -alias upload

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build signed release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::Release APK not found"
            find app/build/outputs -type f -name '*.apk' -print || true
            exit 1
          fi

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"

          echo "APK SHA256:"
          sha256sum "$APK"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: ANISCROLL-TV-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # Export the keystore as a protected artifact for backup.
      - name: Export signing keystore backup
        uses: actions/upload-artifact@v4
        with:
          name: ANISCROLL-TV-signing-key-BACKUP
          path: ${{ runner.temp }}/aniscroll-upload-key.jks
          if-no-files-found: error
          retention-days: 30
