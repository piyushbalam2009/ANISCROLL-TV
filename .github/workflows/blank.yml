
name: Build ANISCROLL-TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la

          WRAPPER=$(find . -name gradlew -type f -print -quit)

          if [ -n "$WRAPPER" ]; then
            DIR=$(dirname "$WRAPPER")
            echo "Found wrapper: $WRAPPER"
          else
            SETTINGS=$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)

            if [ -z "$SETTINGS" ]; then
              echo "ERROR: Android Gradle project not found"
              exit 1
            fi

            DIR=$(dirname "$SETTINGS")
            echo "Gradle wrapper missing. Using installed Gradle."
          fi

          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        shell: bash
        run: |
          cd "${{ steps.project.outputs.dir }}"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ANISCROLL-TV-debug
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
