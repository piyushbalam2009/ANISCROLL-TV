name: Build ANISCROLL-TV Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: aniscroll-tv-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Test and build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36.1
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platforms;android-36.1" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Verify build tools and required signing secrets
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done

          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          echo "Required Android build tools are installed."
          echo "Required release signing secrets are present."

      - name: Restore release signing keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          set -euo pipefail

          KEYSTORE_PATH="$RUNNER_TEMP/aniscroll-upload-key.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Decoded keystore is empty or invalid."
            exit 1
          fi

          if ! keytool -list -keystore "$KEYSTORE_PATH" \
              -storepass "$RELEASE_STORE_PASSWORD" -alias upload >/dev/null 2>&1; then
            echo "::error::Keystore could not be opened or alias 'upload' was not found."
            exit 1
          fi

          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "Release keystore restored and alias verified."

      - name: Create local environment file from optional GitHub secrets
        shell: bash
        env:
          HOSHIKA_CLIENT_ID: ${{ secrets.HOSHIKA_CLIENT_ID }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          FANART_API_KEY: ${{ secrets.FANART_API_KEY }}
        run: |
          set -euo pipefail
          : > .env

          [ -z "$HOSHIKA_CLIENT_ID" ] || printf 'HOSHIKA_CLIENT_ID=%s\n' "$HOSHIKA_CLIENT_ID" >> .env
          [ -z "$TMDB_API_KEY" ] || printf 'TMDB_API_KEY=%s\n' "$TMDB_API_KEY" >> .env
          [ -z "$FANART_API_KEY" ] || printf 'FANART_API_KEY=%s\n' "$FANART_API_KEY" >> .env

          chmod 600 .env
          echo "Optional app environment values prepared (secret values are not printed)."

      - name: Run unit tests
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build signed release APK
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature and package
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -s "$APK" ]; then
            echo "::error::Expected release APK was not generated at $APK"
            find app/build/outputs -type f -name '*.apk' -print || true
            exit 1
          fi

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          echo "APK size: $(du -h "$APK" | cut -f1)"
          echo "APK SHA-256: $(sha256sum "$APK" | cut -d' ' -f1)"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: ANISCROLL-TV-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
