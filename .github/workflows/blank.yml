
name: Build ANISCROLL-TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find Android project
        id: project
        shell: bash
        run: |
          echo "Repository contents:"
          ls -la

          WRAPPER=$(find . -name gradlew -type f -print -quit)

          if [ -n "$WRAPPER" ]; then
            PROJECT_DIR=$(dirname "$WRAPPER")
            echo "Found Gradle wrapper: $WRAPPER"
          else
            PROJECT_DIR=$(find . -name settings.gradle.kts -o -name settings.gradle | head -n 1)
            if [ -z "$PROJECT_DIR" ]; then
              echo "No Android Gradle project found!"
              exit 1
            fi
            PROJECT_DIR=$(dirname "$PROJECT_DIR")
            echo "Wrapper missing; using installed Gradle."
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        shell: bash
        run: |
          cd "${{ steps.project.outputs.dir }}"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ANISCROLL-TV-debug
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
